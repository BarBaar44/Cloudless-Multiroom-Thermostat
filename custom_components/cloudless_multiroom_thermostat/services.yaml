pause_room:
  target:
    entity:
      integration: cloudless_multiroom_thermostat
      domain: climate
resume_room:
  target:
    entity:
      integration: cloudless_multiroom_thermostat
      domain: climate
set_all_off:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: cloudless_multiroom_thermostat
experimental_report:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: cloudless_multiroom_thermostat
set_schedule:
  target:
    entity:
      integration: cloudless_multiroom_thermostat
      domain: climate
  fields:
    week:
      selector:
        object:
    scheduling:
      default: "on"
      selector:
        select:
          options:
            - "on"
            - "off"
resume_schedule:
  target:
    entity:
      integration: cloudless_multiroom_thermostat
      domain: climate
suspend_schedules:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: cloudless_multiroom_thermostat
resume_schedules:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: cloudless_multiroom_thermostat
set_override:
  target:
    entity:
      integration: cloudless_multiroom_thermostat
      domain: climate
  fields:
    temperature:
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: °C
    preset:
      selector:
        text:
    until:
      selector:
        select:
          options:
            - next_change
            - permanent
    duration:
      selector:
        duration:
    keep_when_away:
      default: false
      selector:
        boolean:
set_guest_mode:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: cloudless_multiroom_thermostat
    "on":
      default: true
      selector:
        boolean:
    until:
      selector:
        datetime:
    duration:
      selector:
        duration:
set_presets:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: cloudless_multiroom_thermostat
    presets:
      selector:
        object:
    temperatures:
      selector:
        object:
